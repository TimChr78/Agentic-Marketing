<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 28 polish patterns</title>
<style>
:root{--background:transparent;--foreground:#202521;--muted:#606860;--card:#fff;--border:#deded7;--primary:#2457d6;--radius:12px;font-family:system-ui,sans-serif;color:var(--foreground)}
html,body{margin:0}*{box-sizing:border-box}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}button,select{font:inherit;min-height:40px;border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:var(--card);color:var(--foreground)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:2px}.frames{display:grid;gap:20px}.sample{min-width:0}.sample h2{font-size:16px}.viewport{overflow:hidden;border:1px solid var(--border);border-radius:12px}iframe{display:block;border:0;transform-origin:top left}label{display:flex;gap:8px;align-items:center}.note{color:var(--muted);font-size:13px}
</style>
<header><label>Pattern <select id="state"><option value="all">All states</option><option value="populated">Populated</option><option value="empty">Empty</option><option value="error">Error</option><option value="loading">Loading</option></select></label><label><input type="checkbox" id="reduce">Preview reduced motion</label><button id="feedback">Show feedback</button></header>
<p class="note">Offline illustrative patterns, not live evidence. Each frame has a native 1440 or 390 CSS-pixel viewport; desktop frames scale to fit. Loading placeholders are static. System reduced-motion preference is always respected.</p>
<div class="frames" id="frames"></div>
<script>
const root=document.querySelector('#frames');
function content(theme,width){return `<!doctype html><html lang="en" data-theme="${theme}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${theme} ${width} polish patterns</title><style>
:root{--bg:#f7f6f2;--surface:#fff;--surface-2:#f0efeb;--surface-3:#e6e5df;--fg:#202521;--fg-2:#4c554e;--muted:#606860;--line:#deded7;--control:#7c807a;--accent:#2457d6;--accent-fg:#fff;--bad:#c0282d;--bad-soft:#fcebeb;--good:#18794a;--fast:120ms;--enter:180ms;--ease:cubic-bezier(.2,.8,.2,1)}
[data-theme=dark]{--bg:#111512;--surface:#191f1b;--surface-2:#222a24;--surface-3:#2c352e;--fg:#edf0e9;--fg-2:#c0c9bf;--muted:#a0aca1;--line:#343e36;--control:#87958a;--accent:#8baafa;--accent-fg:#111512;--bad:#ff9292;--bad-soft:#422427;--good:#70d29b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/22px system-ui,sans-serif}nav{height:56px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:16px}main{padding:32px;max-width:1280px;margin:auto}h1{font-size:24px;line-height:32px;margin:0 0 4px;font-weight:600}h2{font-size:16px;line-height:24px;margin:0 0 12px}p{margin:4px 0 16px;color:var(--fg-2)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:32px}.panel{min-width:0;min-height:248px;background:var(--surface);border-radius:12px;padding:20px}.muted{color:var(--muted);font-size:12px;line-height:18px}.kpi{font-size:32px;line-height:40px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.empty{text-align:center}.error{background:var(--bad-soft);color:var(--bad);padding:12px;border-radius:8px}.error p{color:inherit}button{font:500 13px/20px system-ui;min-height:40px;padding:8px 12px;border:1px solid var(--control);border-radius:8px;color:var(--fg);background:var(--surface);cursor:pointer;transition:background-color var(--fast) var(--ease)}button:hover{background:var(--surface-2)}button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{color:var(--muted);background:var(--surface-2);cursor:default}.sk{display:block;background:var(--surface-3);border-radius:4px;height:14px;margin:12px 0;max-width:100%}.sk.value{height:40px;width:120px}.slot{min-height:204px}.feedback{margin-top:24px;min-height:48px}.toast{display:inline-block;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--good);animation:enter var(--enter) var(--ease)}@keyframes enter{from{opacity:0;transform:translateY(8px)}}[hidden]{display:none!important}[data-reduce=true] *,[data-reduce=true] *::before{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(max-width:767px){main{padding:24px 16px}.grid{grid-template-columns:1fr;gap:12px;margin-top:24px}.panel{padding:16px}.kpi{font-size:28px;line-height:36px}}
</style><nav aria-label="Example context">Marketing operations <span class="muted">Pattern reference · ${theme} · ${width}px</span></nav><main><h1>Performance</h1><p>Consistent states with a clear next action.</p><div class="grid">
<section class="panel" data-state="populated"><h2>Delivered people</h2><div class="slot"><div class="kpi">427</div><p>Delivered people after retries are deduplicated.</p><p class="muted">1–7 Nov 2026 · UTC<br>427 people with a delivery<br>Updated 8 Nov 2026, 09:00 UTC</p><button>Show data table</button></div></section>
<section class="panel empty" data-state="empty"><h2>No sends in this period</h2><div class="slot"><p>Choose another period to see performance.</p><button class="primary" onclick="this.nextElementSibling.hidden=false">Change period</button><p hidden class="muted">Example only: existing period selector opens here.</p></div></section>
<section class="panel" data-state="error"><h2>Performance unavailable</h2><div class="slot"><div class="error" role="alert"><p>Couldn't load performance. Saved settings are unchanged.</p><button onclick="this.parentElement.querySelector('p').textContent='Example retry requested. No network request was made.'">Retry</button></div></div></section>
<section class="panel" data-state="loading"><h2>Delivered people</h2><div class="slot" aria-busy="true"><div role="status">Loading performance</div><div aria-hidden="true"><span class="sk value"></span><span class="sk" style="width:85%"></span><span class="sk" style="width:65%"></span><span class="sk" style="width:75%"></span></div><button disabled aria-label="Saving changes">◷ Saving changes…</button></div></section></div><div class="feedback" aria-live="polite"></div><p class="muted">No repeating animation. Feedback enters once in 180 ms. Colour feedback takes 120 ms. This mock makes no data requests and saves nothing.</p></main></html>`}
for(const width of [1440,390])for(const theme of ['light','dark']){const section=document.createElement('section');section.className='sample';const title=document.createElement('h2');title.textContent=width+' px · '+theme;const box=document.createElement('div');box.className='viewport';const frame=document.createElement('iframe');frame.title=title.textContent;frame.width=width;frame.height=width===390?1480:620;frame.setAttribute('sandbox','allow-scripts allow-same-origin');frame.srcdoc=content(theme,width);box.append(frame);section.append(title,box);root.append(section);frame.onload=()=>{resize();update()}}
function resize(){for(const f of document.querySelectorAll('iframe')){const s=Math.min(1,f.parentElement.clientWidth/Number(f.width));f.style.transform='scale('+s+')';f.parentElement.style.height=Number(f.height)*s+'px'}}
function update(){for(const f of document.querySelectorAll('iframe')){const d=f.contentDocument;if(!d)continue;d.documentElement.dataset.reduce=document.querySelector('#reduce').checked;for(const panel of d.querySelectorAll('[data-state]'))panel.hidden=document.querySelector('#state').value!=='all'&&document.querySelector('#state').value!==panel.dataset.state}}
document.querySelector('#state').onchange=update;document.querySelector('#reduce').onchange=update;document.querySelector('#feedback').onclick=()=>{for(const f of document.querySelectorAll('iframe')){const box=f.contentDocument?.querySelector('.feedback');if(box){box.replaceChildren();const msg=f.contentDocument.createElement('span');msg.className='toast';msg.textContent='Changes saved';box.append(msg)}}};new ResizeObserver(resize).observe(root);
</script></html>
