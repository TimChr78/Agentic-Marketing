{{- if .Values.ingress.enabled }}
{{- if not (trim (toString .Values.config.TRUSTED_PROXY_CIDRS)) }}
{{- fail "config.TRUSTED_PROXY_CIDRS is empty while ingress.enabled is true. With an empty proxy list the Ingress forwarding headers are ignored, so every client is seen as the ingress controller and shares one rate-limit bucket. Set config.TRUSTED_PROXY_CIDRS to the ranges the app sees as its peer (the ingress controller pod or node network, e.g. 10.244.0.0/16), and keep config.CLIENT_IP_HEADER as the header your controller sets. See docs/deployment/kubernetes.md#client-ip-behind-the-ingress." }}
{{- end }}
{{- $api := include "am.fullnameFor" (dict "root" . "suffix" "api") }}
{{- $ingest := include "am.fullnameFor" (dict "root" . "suffix" "ingest") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "am.fullname" . }}
  labels: {{- include "am.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $host := uniq (prepend (default (list) .Values.ingress.extraHosts) .Values.ingress.host) }}
    - host: {{ $host | quote }}
      http:
        paths:
          # Only the public ingest/decide/push paths go to the ingest role. Admin REST
          # (/v1/<command>) and the admin UI, auth, MCP and SCIM stay on the api role; a blanket
          # /v1/ prefix would send uploads and every command to the smaller ingest pods (#1157).
          {{- range $path := list "/v1/batch" "/v1/b" "/v1/track" "/v1/t" "/v1/page" "/v1/p" "/v1/screen" "/v1/s" "/v1/identify" "/v1/i" "/v1/group" "/v1/g" "/v1/alias" "/v1/a" "/v1/decide" "/v1/push" "/v1/consent/purposes" "/f/" "/hooks/in/" }}
          - path: {{ $path }}
            pathType: Prefix
            backend: { service: { name: {{ $ingest }}, port: { name: http } } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ $api }}, port: { name: http } } }
    {{- end }}
{{- end }}
