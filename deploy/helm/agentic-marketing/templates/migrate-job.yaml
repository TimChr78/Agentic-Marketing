{{- if .Values.migrations.enabled }}
# The release ConfigMap and Secret are created after a pre-install hook, so the hook carries its
# own copies. They are deleted when the job succeeds and kept when it fails, so the logs and the
# configuration can be inspected. The job mounts them in the same order as the role Deployments:
# ConfigMap first, Secret second, so a Secret value wins over the chart default (#1159).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "am.fullnameFor" (dict "root" . "suffix" "migrate-config") }}
  labels: {{- include "am.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
{{- if not (hasKey .Values.config "PORT") }}
  PORT: {{ .Values.port | quote }}
{{- end }}
{{- range $k, $v := .Values.config }}
{{- if ne (toString $v) "" }}
  {{ $k }}: {{ $v | toString | quote }}
{{- end }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "am.fullnameFor" (dict "root" . "suffix" "migrate-secrets") }}
  labels: {{- include "am.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | toString | quote }}
{{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "am.fullnameFor" (dict "root" . "suffix" (printf "migrate-%d" .Release.Revision)) }}
  labels: {{- include "am.labels" . | nindent 4 }}
  annotations:
    # Pre-install/pre-upgrade, never post-install. Helm runs post-install hooks after the release
    # resources are created (and after --wait), so on a first install the four roles with
    # SKIP_MIGRATIONS=true would serve from an unmigrated database behind a healthy /readyz.
    # This hook runs before any role exists on install and before the new ReplicaSets roll on
    # upgrade. It carries its own configuration (and, for managed secrets, its own Secret) because
    # the release ConfigMap and Secret do not exist yet on a first install.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "am.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- if not .Values.serviceAccount.create }}
      # A chart-created ServiceAccount does not exist until after a pre-install hook. The migration
      # needs no API access, so it uses the namespace default; an external ServiceAccount is
      # already there and stays attached for clusters that require it for pulls or IAM.
      serviceAccountName: {{ include "am.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "am.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          command: [pnpm, --filter, "@agentic-marketing/server", cli, migrate]
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "am.fullnameFor" (dict "root" . "suffix" "migrate-config") }}
            - secretRef:
                name: {{ if .Values.secrets.existingSecret }}{{ include "am.secretName" . }}{{ else }}{{ include "am.fullnameFor" (dict "root" . "suffix" "migrate-secrets") }}{{ end }}
          resources: {{- toYaml .Values.migrations.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts: {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
