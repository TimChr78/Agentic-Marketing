{{- if and (not .Values.secrets.existingSecret) .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "am.secretName" . }}
  labels: {{- include "am.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | toString | quote }}
{{- end }}
{{- end }}
{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.values) }}
{{- fail "Set secrets.existingSecret (recommended) or secrets.values: DATABASE_URL, APP_DB_PASSWORD, AUTH_SECRET and MASTER_KEY (or the KEY_PROVIDER credentials)." }}
{{- end }}
