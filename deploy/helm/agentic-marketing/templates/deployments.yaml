{{- range $role, $r := .Values.roles }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "am.fullname" $ }}-{{ $role }}
  labels:
    {{- include "am.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  {{- if not (and $r.autoscaling $r.autoscaling.enabled) }}
  replicas: {{ $r.replicas }}
  {{- end }}
  {{- if eq $role "scheduler" }}
  strategy: { type: Recreate }   # never two schedulers at once
  {{- end }}
  selector:
    matchLabels: {{- include "am.selector" (dict "root" $ "role" $role) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "am.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with $.Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "am.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $role }}
          image: {{ include "am.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext: {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            - name: ROLE
              value: {{ $role }}
            # Migrations run once, in the pre-install/upgrade job.
            - name: SKIP_MIGRATIONS
              value: "true"
            {{- with $.Values.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          envFrom: {{- include "am.envFrom" $ | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          resources: {{- toYaml $r.resources | nindent 12 }}
          {{- with $.Values.extraVolumeMounts }}
          volumeMounts: {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $.Values.extraVolumes }}
      volumes: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
