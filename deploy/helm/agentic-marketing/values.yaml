# Agentic Marketing on Kubernetes. Postgres, ClickHouse, NATS (JetStream) and Valkey are not part
# of this chart: point it at managed services or operators you already run (see
# docs/deployment/kubernetes.md for a reference deployment). Use PostgreSQL 18 for a new cluster;
# 16 is the supported minimum (through at least June 2027) and its major upgrade is covered in
# docs/deployment/postgres-18.md.

# Released images (linux/amd64 and linux/arm64) are published to GitHub's registry for every
# version tag. To run your own build, push it to your registry and set repository and tag.
image:
  repository: ghcr.io/timchr78/agentic-marketing
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The port the api and ingest roles listen on. The ConfigMap, the container port, the Service
# target and the probes all use this one value, so changing it moves them together. Set this
# rather than `config.PORT`, which only changes the environment and leaves the Service behind.
port: 3000

# One image, four roles (ADR-0002). Each role is its own Deployment so it scales on its own.
roles:
  api:          # UI, REST, MCP, copilot, e-mail links and webhooks
    replicas: 2
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
  ingest:       # /v1 events and decide, signup forms, inbound hooks
    replicas: 2
    resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { memory: 768Mi } }
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
  worker:       # ClickHouse sink, profile workers, journeys, AI steps, deliveries
    replicas: 2
    resources: { requests: { cpu: 500m, memory: 768Mi }, limits: { memory: 2Gi } }
  scheduler:    # segment refreshes, broadcasts, retention, token refresh, audience sync, spend import
    replicas: 1   # keep at 1: its loops are not coordinated across replicas
    resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { memory: 2Gi } }

# Plain settings (become a ConfigMap). See .env.example for every variable.
config:
  PUBLIC_URL: https://marketing.example.com
  PUBLIC_LINKS_URL: ""
  PUBLIC_PORT: ""                     # adds the public-only listener (the Service exposes `port`; see docs/deployment/kubernetes.md)
  CLIENT_IP_HEADER: x-forwarded-for   # ordered list for public + LAN ingress, e.g. cf-connecting-ip,x-forwarded-for
  TRUSTED_PROXY_CIDRS: ""             # ranges allowed to set forwarding headers. Required with ingress.enabled: true
                                      # (the chart refuses to render otherwise). Use the ranges the app sees as its
                                      # peer: the ingress controller's pod network (e.g. 10.244.0.0/16) or node
                                      # network when it uses hostNetwork. See docs/deployment/kubernetes.md.
  BETTER_AUTH_TRUSTED_ORIGINS: ""     # Better Auth's own extra origins; TRUSTED_ORIGINS is the documented list
  APP_DB_ROLE: ""                     # the row-level-security role; empty uses am_app
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_DATABASE: am
  CLICKHOUSE_ROW_POLICIES: required
  NATS_URL: nats://nats:4222
  NATS_RETENTION_HOURS: "24"
  VALKEY_URL: redis://valkey:6379
  KEY_PROVIDER: local   # local (MASTER_KEY), openbao or aws-kms
  # OpenBao and AWS KMS locations are plain settings; their credentials are Secret values below.
  OPENBAO_ADDR: ""
  OPENBAO_TOKEN_FILE: ""              # a path to a token file a sidecar or projection writes
  OPENBAO_TRANSIT_MOUNT: ""
  OPENBAO_TRANSIT_KEY: ""
  OPENBAO_NAMESPACE: ""
  AWS_KMS_KEY_ID: ""
  AWS_REGION: ""
  AWS_KMS_ENDPOINT: ""
  LOG_LEVEL: info       # pino: fatal, error, warn, info, debug, trace or silent
  EMAIL_TRACK_CLICKS: "true"
  RETENTION_UNCONFIRMED_DAYS: "30"
  RETENTION_LOG_DAYS: "180"
  RETENTION_HOSTED_AGENT_RUN_DAYS: "90"
  RETENTION_IDEMPOTENCY_DAYS: "30"
  WORKSPACE_QUOTA: "10"
  EGRESS_ALLOWED_HOSTS: ""
  # Backups (`am backup`, and the image's pre-upgrade dump): the chart runs no backup job, but these
  # settings reach a pod you run them in and `am doctor`. See docs/deployment/backups.md.
  BACKUP_DIR: ""
  BACKUP_CRON: ""
  BACKUP_KEEP_DAYS: ""
  BACKUP_VERIFY_MAX_AGE_DAYS: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  # Used as-is for the traces exporter; the generic endpoint always gets /v1/traces appended.
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""

# Secret settings: DATABASE_URL, APP_DB_PASSWORD, AUTH_SECRET, and MASTER_KEY or the OpenBao /
# AWS KMS credentials. Prefer an existing Secret (sealed-secrets, External Secrets, Vault agent…);
# `values` creates one from here, for trying things out. Add METRICS_TOKEN here (not under config)
# to enable GET /metrics; without it the endpoint answers 404.
secrets:
  existingSecret: ""
  # Helm cannot read an existingSecret's contents, so changing it in place does not change the pod
  # template. Bump this value (for example to the rotation date) in the same `helm upgrade` to roll
  # the roles; alternatively run `kubectl rollout restart`. Managed secrets.values roll by
  # themselves because the rendered Secret is part of the checksum.
  revision: ""
  values: {}
  #   DATABASE_URL: postgres://am:…@postgres:5432/am
  #   APP_DB_PASSWORD: …
  #   AUTH_SECRET: …
  #   MASTER_KEY: …
  #   MASTER_KEY_PREVIOUS: …                # during a rotation, the old key(s), comma-separated
  #   METRICS_TOKEN: …   # openssl rand -hex 24; scrape /metrics with Bearer $METRICS_TOKEN
  #   OPENBAO_TOKEN: …                      # with KEY_PROVIDER=openbao and no token file, or
  #   AWS_ACCESS_KEY_ID: …                  # with KEY_PROVIDER=aws-kms; the location settings
  #   AWS_SECRET_ACCESS_KEY: …              # (OPENBAO_ADDR, AWS_REGION, …) are config values
  #   AWS_SESSION_TOKEN: …
  #   OTEL_EXPORTER_OTLP_HEADERS: …          # OTLP collector auth: a header list, a credential
  #   OTEL_EXPORTER_OTLP_TRACES_HEADERS: …   # the trace-specific variant of the same

# Extra environment for every role, e.g. a token file mounted by an OpenBao agent. The migration
# hook uses these too, so on a first install any Secret or ConfigMap they reference must already
# exist in the namespace.
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# Postgres, ClickHouse and Valkey migrations run as a pre-install/pre-upgrade hook: before the
# roles are created on a first install and before they roll on an upgrade. The hook carries its
# configuration and secret values itself because the release's ConfigMap and Secret do not exist
# yet on install; see docs/deployment/kubernetes.md.
migrations:
  enabled: true
  backoffLimit: 3
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: marketing.example.com
  # Every verified brand domain serves subscriber-facing links. Kubernetes only routes a host that
  # an Ingress names, so list each brand host here (the chart renders the same path split for each).
  # Add the same hosts to ingress.tls[].hosts so their certificates cover them.
  extraHosts: []
  #  - links.martechsignal.com
  #  - second.example.com
  tls: []
  #  - secretName: marketing-tls
  #    hosts: [marketing.example.com, links.martechsignal.com]

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}   # e.g. eks.amazonaws.com/role-arn for AWS KMS through IRSA (with an agent)

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
