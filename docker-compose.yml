# Self-hosted single node: Postgres (configuration, profiles), ClickHouse (events), NATS JetStream
# (event bus), Valkey (session state for personalization) and the app.
#
# Never edit this file. Put site-specific changes (an external network, bind mounts, resource
# limits, backups) in compose.override.yaml, which Compose reads automatically. Upgrading then means
# replacing this file with the new release's copy and bumping AM_VERSION, with no merge to resolve.
#
# Copy .env.example to .env and fill in the secrets first.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: am
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: am
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U am"]
      interval: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1  # row policies need it
    # Cap the whole container (server, caches and queries); ClickHouse's own limits still apply inside it.
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-2g}
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping"]
      interval: 5s
      retries: 20

  nats:
    # The alpine variant has a shell and wget for the healthcheck; the plain image has neither.
    image: nats:2.15.0-alpine
    restart: unless-stopped
    # -m 8222 serves the monitoring endpoint the healthcheck reads.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8.1.9
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping"]
      interval: 5s
      retries: 10

  app:
    # Pull the release image; docker-compose.build.yml builds this checkout from source instead.
    image: ghcr.io/timchr78/agentic-marketing:${AM_VERSION:-0.3.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      ROLE: all
      PORT: 3000
      PUBLIC_PORT: ${PUBLIC_PORT:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      PUBLIC_LINKS_URL: ${PUBLIC_LINKS_URL:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-}
      EMAIL_TRACK_CLICKS: ${EMAIL_TRACK_CLICKS:-true}
      STRICT_INPUTS: ${STRICT_INPUTS:-false}
      MCP_TEXT_CONTENT: ${MCP_TEXT_CONTENT:-json}
      MCP_TOOL_NAME_STYLE: ${MCP_TOOL_NAME_STYLE:-dotted}
      ASSET_MAX_BYTES: ${ASSET_MAX_BYTES:-5242880}
      RETENTION_UNCONFIRMED_DAYS: ${RETENTION_UNCONFIRMED_DAYS:-30}
      RETENTION_LOG_DAYS: ${RETENTION_LOG_DAYS:-180}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      DATABASE_URL: postgres://am:${POSTGRES_PASSWORD}@postgres:5432/am
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env}
      MASTER_KEY_PREVIOUS: ${MASTER_KEY_PREVIOUS:-}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_ROW_POLICIES: ${CLICKHOUSE_ROW_POLICIES:-required}
      NATS_URL: nats://nats:4222
      NATS_RETENTION_HOURS: ${NATS_RETENTION_HOURS:-24}
      VALKEY_URL: redis://valkey:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      BACKUP_DIR: /backups
      SKIP_PRE_UPGRADE_BACKUP: ${SKIP_PRE_UPGRADE_BACKUP:-false}
    volumes:
      - backups:/backups
    ports:
      - "${AM_PORT:-3000}:3000"
      # The public-only listener, published on PUBLIC_BIND (host:port, loopback-only by default; 3201
      # because 3001 is a common homelab port and 3210 is a natural admin port). With PUBLIC_PORT
      # unset nothing listens behind it. A tunnel on a Docker network reaches http://app:3001 and
      # needs no host port: drop the mapping with `ports: !override` in compose.override.yaml. A
      # tunnel on another host sets e.g. PUBLIC_BIND=0.0.0.0:3001.
      - "${PUBLIC_BIND:-127.0.0.1:3201}:${PUBLIC_PORT:-3001}"

volumes:
  pgdata:
  chdata:
  natsdata:
  backups:
