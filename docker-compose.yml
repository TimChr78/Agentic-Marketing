# Self-hosted single node: Postgres (configuration, profiles), ClickHouse (events), NATS JetStream
# (event bus), Valkey (session state for personalization) and the app.
#
# Never edit this file. Put site-specific changes (an external network, bind mounts, resource
# limits, backups) in compose.override.yaml, which Compose reads automatically. Upgrading then means
# replacing this file with the new release's copy and bumping AM_VERSION, with no merge to resolve.
#
# Copy .env.example to .env and fill in the secrets first.
#
# PostgreSQL 18 is the default for new installs. An existing 16 data directory cannot be opened by
# 18: the postgres-check service stops with guidance before anything starts, and POSTGRES_IMAGE in
# .env keeps an install on 16 until it is migrated (docs/deployment/postgres-18.md).
#
# Service images are pinned by digest: the multi-arch index (linux/amd64 and linux/arm64) behind
# the tag, so `docker compose pull` never changes the runtime behind a release. The tag stays in
# front of the digest, so an update is readable; Dependabot proposes new digests for the pinned
# images (and the Dockerfile's), and bumping one is a deliberate change. The `app` image follows
# AM_VERSION, the release you choose; the Postgres image follows POSTGRES_IMAGE, which defaults
# to PostgreSQL 18.
services:
  # A one-shot guard before Postgres: a data directory cannot be opened by another major version.
  # The postgres:18 image would otherwise initialise a fresh cluster while an existing 16 volume
  # sits unused, which looks like an empty install. This fails an upgrade of an existing 16 volume
  # with the upgrade path, before Postgres starts, and opens the volume read-only. `restart: "no"`
  # is deliberate: it must run once and exit.
  postgres-check:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015}
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "postgres-check: empty pgdata volume; PostgreSQL $$PG_MAJOR will initialise it"
          exit 0
        fi
        have=$$(cat /var/lib/postgresql/data/PG_VERSION)
        if [ "$$have" = "$$PG_MAJOR" ]; then
          echo "postgres-check: the pgdata volume holds PostgreSQL $$have"
          exit 0
        fi
        echo "error: the pgdata volume holds a PostgreSQL $$have cluster, but this stack starts PostgreSQL $$PG_MAJOR." >&2
        echo "Nothing changed: the volume was opened read-only and PostgreSQL did not start." >&2
        echo "Upgrade the data with the documented dump-and-restore (or pg_upgrade): docs/deployment/postgres-18.md" >&2
        echo "To stay on the old major for now, set POSTGRES_IMAGE in .env to the previous release's image, then run 'docker compose up -d'." >&2
        exit 1
    volumes:
      - pgdata:/var/lib/postgresql/data:ro

  postgres:
    # Change POSTGRES_IMAGE in .env to run another official postgres image (for example to stay on
    # 16 while an existing install is migrated). The guard above compares that image's major with
    # the volume, so a mismatch stops with guidance instead of starting an empty database.
    image: ${POSTGRES_IMAGE:-postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015}
    restart: unless-stopped
    depends_on:
      postgres-check:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: am
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: am
      # Keep the pre-18 layout (/var/lib/postgresql/data) so one volume serves 16 and 18, and the
      # guard can compare what is in it with the image's major. 18's own default is
      # /var/lib/postgresql/18/docker, which would silently ignore an existing volume's root.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U am"]
      interval: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.41.14@sha256:4fcc05a5642c52250ab57a184bc0523a00ba5dcd4e8b43a918e7477b844f1048
    restart: unless-stopped
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1  # row policies need it
    # Cap the whole container (server, caches and queries); ClickHouse's own limits still apply inside it.
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-2g}
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping"]
      interval: 5s
      retries: 20

  nats:
    # The alpine variant has a shell and wget for the healthcheck; the plain image has neither.
    image: nats:2.15.3-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a
    restart: unless-stopped
    # -m 8222 serves the monitoring endpoint the healthcheck reads.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9.2.0@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping"]
      interval: 5s
      retries: 10

  app:
    # Pull the release image; docker-compose.build.yml builds this checkout from source instead.
    image: ghcr.io/timchr78/agentic-marketing:${AM_VERSION:-0.17.6}
    restart: unless-stopped
    # Shutdown drains the workers and lets an in-flight provider call (an OAuth token exchange that
    # may rotate the refresh token) finish within its 10 s request deadline and be stored; Docker's
    # default 10 s grace would SIGKILL at that same moment.
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      # Every variable in apps/server/src/config.ts is passed here. Keep the explicit list (rather
      # than env_file) so Compose's own settings and the fixed service URLs below cannot leak into
      # the app container. An unset or empty value is not set: loadConfig() ignores '' and applies
      # the documented default.
      ROLE: all
      PORT: 3000
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-}
      PUBLIC_PORT: ${PUBLIC_PORT:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      PUBLIC_LINKS_URL: ${PUBLIC_LINKS_URL:-}
      WEB_DIST: ${WEB_DIST:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-}
      EMAIL_TRACK_CLICKS: ${EMAIL_TRACK_CLICKS:-true}
      STRICT_INPUTS: ${STRICT_INPUTS:-false}
      SSO_DOMAIN_VERIFICATION: ${SSO_DOMAIN_VERIFICATION:-}
      MCP_TEXT_CONTENT: ${MCP_TEXT_CONTENT:-json}
      MCP_TOOL_NAME_STYLE: ${MCP_TOOL_NAME_STYLE:-dotted}
      ASSET_MAX_BYTES: ${ASSET_MAX_BYTES:-5242880}
      RETENTION_UNCONFIRMED_DAYS: ${RETENTION_UNCONFIRMED_DAYS:-30}
      RETENTION_LOG_DAYS: ${RETENTION_LOG_DAYS:-180}
      RETENTION_HOSTED_AGENT_RUN_DAYS: ${RETENTION_HOSTED_AGENT_RUN_DAYS:-90}
      RETENTION_IDEMPOTENCY_DAYS: ${RETENTION_IDEMPOTENCY_DAYS:-30}
      WORKSPACE_QUOTA: ${WORKSPACE_QUOTA:-10}
      ERASURE_GRACE_HOURS: ${ERASURE_GRACE_HOURS:-}
      STEP_UP_MAX_FAILURES: ${STEP_UP_MAX_FAILURES:-}
      STEP_UP_WINDOW_SECONDS: ${STEP_UP_WINDOW_SECONDS:-}
      STEP_UP_LOCKOUT_SECONDS: ${STEP_UP_LOCKOUT_SECONDS:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      # Better Auth appends its own list verbatim, outside the bounded matcher; config.ts reads it
      # to refuse a wildcard there (#947). TRUSTED_ORIGINS is the documented setting.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      # POSTGRES_PASSWORD is interpolated raw: Compose has no percent-encoding. Use a hex password
      # (`openssl rand -hex 32`, as `am init` does); base64 can contain `/`, which breaks the URL.
      DATABASE_URL: postgres://am:${POSTGRES_PASSWORD}@postgres:5432/am
      APP_DB_ROLE: ${APP_DB_ROLE:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      MASTER_KEY: ${MASTER_KEY:-}
      MASTER_KEY_PREVIOUS: ${MASTER_KEY_PREVIOUS:-}
      KEY_PROVIDER: ${KEY_PROVIDER:-}
      OPENBAO_ADDR: ${OPENBAO_ADDR:-}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
      OPENBAO_TOKEN_FILE: ${OPENBAO_TOKEN_FILE:-}
      OPENBAO_TRANSIT_MOUNT: ${OPENBAO_TRANSIT_MOUNT:-}
      OPENBAO_TRANSIT_KEY: ${OPENBAO_TRANSIT_KEY:-}
      OPENBAO_NAMESPACE: ${OPENBAO_NAMESPACE:-}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_KMS_ENDPOINT: ${AWS_KMS_ENDPOINT:-}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-}
      CLICKHOUSE_ROW_POLICIES: ${CLICKHOUSE_ROW_POLICIES:-required}
      NATS_URL: nats://nats:4222
      NATS_NAMESPACE: ${NATS_NAMESPACE:-}
      NATS_RETENTION_HOURS: ${NATS_RETENTION_HOURS:-24}
      VALKEY_URL: redis://valkey:6379
      VALKEY_PREFIX: ${VALKEY_PREFIX:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      # OTLP header lists can carry an Authorization credential. `.env` stays on the host, so they
      # are forwarded exactly like the other secrets here (#965).
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      BACKUP_DIR: /backups
      # The scheduled `am backup --schedule` reads these too, so `docker compose exec app am backup
      # --schedule` (and the backup service of compose.override.yaml) share one .env (#965 review).
      BACKUP_CRON: ${BACKUP_CRON:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
      BACKUP_VERIFY_MAX_AGE_DAYS: ${BACKUP_VERIFY_MAX_AGE_DAYS:-}
      SKIP_PRE_UPGRADE_BACKUP: ${SKIP_PRE_UPGRADE_BACKUP:-false}
    volumes:
      - backups:/backups
    ports:
      # Loopback only by default, like the public listener below: the admin UI, sign-in and REST API
      # are reachable from this machine until AM_BIND widens it. Set AM_BIND=0.0.0.0 (or a LAN
      # address) only when the network in front is trusted, or keep it loopback and put a tunnel or
      # reverse proxy on this host.
      - "${AM_BIND:-127.0.0.1}:${AM_PORT:-3000}:3000"
      # The public-only listener, published on PUBLIC_BIND (host:port, loopback-only by default; 3201
      # because 3001 is a common homelab port and 3210 is a natural admin port). With PUBLIC_PORT
      # unset nothing listens behind it. A tunnel on a Docker network reaches http://app:3001 and
      # needs no host port: drop the mapping with `ports: !override` in compose.override.yaml. A
      # tunnel on another host sets e.g. PUBLIC_BIND=0.0.0.0:3001.
      - "${PUBLIC_BIND:-127.0.0.1:3201}:${PUBLIC_PORT:-3001}"

volumes:
  pgdata:
  chdata:
  natsdata:
  backups:
