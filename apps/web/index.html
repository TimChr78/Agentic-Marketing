<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Agentic Marketing</title>
    <script>
      // Theme before first paint (docs/design/DESIGN.md → Themes): the signed-in person's choice on this
      // device, else the last choice made here, else the OS preference. Kept in sync by src/app/theme.ts.
      (function () {
        try {
          var u = localStorage.getItem('am.theme.user');
          var pref = (u && localStorage.getItem('am.theme.' + u)) || localStorage.getItem('am.theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
