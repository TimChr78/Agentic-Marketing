name: Release

# Pushing a version tag (v0.1.0) publishes a release: the container image for linux/amd64 and
# linux/arm64 to GitHub's registry, the packaged Helm chart, and a GitHub release with the
# CHANGELOG section of that version. 0.x versions are marked as pre-releases.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the versions
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in package.json apps/server/package.json; do
            got=$(node -p "require('./$f').version")
            [ "$got" = "$v" ] || { echo "::error::$f has version $got, the tag is $GITHUB_REF_NAME"; exit 1; }
          done
          chart=$(grep '^appVersion:' deploy/helm/agentic-marketing/Chart.yaml | tr -d '"' | awk '{print $2}')
          [ "$chart" = "$v" ] || { echo "::error::Chart appVersion is $chart, the tag is $GITHUB_REF_NAME"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in 0.*|*-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentic-marketing
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Agentic Marketing
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Package the chart
        run: helm package deploy/helm/agentic-marketing --destination dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # The CHANGELOG section of this version, without its heading.
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          printf '\n**Image:** `ghcr.io/%s/agentic-marketing:%s`\n' "${GITHUB_REPOSITORY_OWNER,,}" "$v" >> notes.md
          flags=""
          [ "${{ steps.version.outputs.prerelease }}" = "true" ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "Agentic Marketing $GITHUB_REF_NAME" --notes-file notes.md $flags
