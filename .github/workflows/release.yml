name: Release

# Publishes a release: the container image for linux/amd64 and linux/arm64 to GitHub's registry,
# the packaged Helm chart, the Compose bundle (scripts/release-bundle.sh) with checksums, and a
# GitHub release with the CHANGELOG section of that version. The image and the release files
# carry SLSA build provenance attestations, the image an SBOM too (#182). The full CI workflow (lint,
# typecheck, audit, tests, e2e, image smoke test, chart) runs first on the same commit, and
# nothing is published unless it passes (#170). 0.x versions are marked as pre-releases.
# Two ways to start it:
#   - push a version tag (v0.1.0);
#   - run it by hand from main (Actions → Release → Run workflow) with the version: it releases
#     that commit of main and creates the tag itself with the release.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (must match package.json, the chart and CHANGELOG.md)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

# One release at a time per release line (major.minor), whichever trigger started it: a tag push
# (v0.14.1) and a manual run (0.14.1 or v0.14.1) must share a group, and every patch of a line
# publishes the same floating `:0.14` image tag, so patches of one line queue behind each other.
# Workflow-level `concurrency` cannot read step outputs, so the group lives on the release job and
# reads the normalised line from the prepare job (#648, #773).
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      line: ${{ steps.version.outputs.line }}
    steps:
      # The version check is a script, so the release fails on the full SemVer grammar before
      # anything is built, and the same check is unit-tested (#671).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalise and validate the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
          else
            raw="$GITHUB_REF_NAME"
          fi
          # Prints the version without one leading v, or fails the job with a ::error:: line.
          v="$(node scripts/release/semver.mjs "$raw")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The release line (major.minor) keys the concurrency group and floats the image tag.
          echo "line=$(node scripts/release/semver.mjs "$raw" --line)" >> "$GITHUB_OUTPUT"

  # The same checks as a pull request, on the commit being released.
  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The group is acquired before the version and release-existence checks below run, so a second
    # run queued for the same version sees the first release when it starts.
    # One group per release line (major.minor), not per version: every patch of a line pushes the
    # same floating `:0.14` image tag, so overlapping patches must queue behind each other (#773).
    # cancel-in-progress stays false so none of them is cancelled mid-publish.
    concurrency:
      group: release-v${{ needs.prepare.outputs.line }}
      cancel-in-progress: false
    # The release files and the image need the token of the event; the attestations need a signed
    # identity (`id-token`) and the permission to store an attestation (`attestations`).
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: A manual release runs from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release workflow from main, not $GITHUB_REF"
          exit 1
      # The commit CI just checked: the tag, or main as it was when the run started.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Check the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.prepare.outputs.version }}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::$v is not a version (x.y.z)"; exit 1; }
          # Every version surface (packages, chart, Compose defaults, README, CHANGELOG): #175.
          node scripts/check-versions.mjs "$v" || { echo "::error::Version files disagree with $v (see above)"; exit 1; }
          if gh release view "v$v" >/dev/null 2>&1; then echo "::error::Release v$v exists already"; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "::error::Tag v$v exists already: push it again to release it, or delete it first"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          case "$v" in 0.*|*-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      # The publication path must not accept a TODO or an incomplete upgrade block.
      - name: Check the release notes
        run: node scripts/release/check-notes.mjs "${{ steps.version.outputs.version }}"

      # Fails early when the release files or the notes' upgrade block are not ready.
      - name: Build the Compose bundle
        run: scripts/release-bundle.sh "${{ steps.version.outputs.version }}" dist

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR and the attestation must name the image exactly, and a registry name is lower-case
      # while an owner may not be (TimChr78).
      - name: Resolve the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agentic-marketing" >> "$GITHUB_OUTPUT"
      # A re-run of an older patch may start after a newer one finished. Concurrency queues a line,
      # and this guard makes the floating major.minor tag follow semver, never publish order: the
      # line tag is pushed only when this version is the newest release in the line (#773), and
      # latest only for the newest stable release of all lines.
      - name: Decide the image tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LINE: ${{ needs.prepare.outputs.line }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
              > "$RUNNER_TEMP/line-tags.raw"; then
            sed 's#^refs/tags/##' "$RUNNER_TEMP/line-tags.raw" > "$RUNNER_TEMP/line-tags.txt"
            spec="$(node scripts/release/image-tags.mjs "$VERSION" "$RUNNER_TEMP/line-tags.txt")"
          else
            # An unreadable tag list must not move the floating tag: publish the exact version only.
            echo "::warning::cannot list release tags; publishing only ${VERSION} (no line tag, no latest)"
            spec="$(node scripts/release/image-tags.mjs "$VERSION" --exact-only)"
          fi
          {
            echo 'spec<<AM_IMAGE_TAGS'
            echo "$spec"
            echo 'AM_IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentic-marketing
          tags: ${{ steps.tags.outputs.spec }}
          # latest is decided by image-tags.mjs (newest stable release of all lines), never added
          # automatically: a retried older release must not move it (0.14.14 review).
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Agentic Marketing
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
      # The amd64 image, loaded locally and run through the same smoke test as CI, before pushing.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: am_smoke-app
          cache-from: type=gha
      - name: Smoke-test the image
        run: SMOKE_NO_BUILD=1 scripts/smoke.sh
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ steps.version.outputs.sha }}
          # Provenance and an SBOM per platform, stored as attestations next to the image.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build provenance (SLSA) for the image, attached in the registry: `gh attestation verify
      # oci://<image>` and `docker buildx imagetools inspect` read it back.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - name: Package the chart
        run: |
          helm package deploy/helm/agentic-marketing --destination dist
          (cd dist && sha256sum -- * > SHA256SUMS)

      # Provenance for the release files, stored against their sha256: `gh attestation verify <file>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tgz
            dist/SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # The CHANGELOG section of this version, without its heading.
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          printf '\n**Image:** `ghcr.io/%s/agentic-marketing:%s`\n' "${GITHUB_REPOSITORY_OWNER,,}" "$v" >> notes.md
          bundle="agentic-marketing-compose-$v.tar.gz"
          printf '\n**Compose bundle:** `%s` (sha256 `%s`): `docker-compose.yml`, `.env.example`, `compose.override.example.yaml`, `UPGRADING.md` and `CHANGELOG.md`. All checksums are in `SHA256SUMS`. Skipping releases? `am upgrade-notes <your version>` merges the upgrade notes of every release in between.\n' \
            "$bundle" "$(awk -v f="$bundle" '$2 == f {print $1}' dist/SHA256SUMS)" >> notes.md
          flags=""
          [ "${{ steps.version.outputs.prerelease }}" = "true" ] && flags="--prerelease"
          # On a manual run the tag does not exist yet: the release creates it on the commit built above.
          gh release create "v$v" dist/*.tgz dist/*.tar.gz dist/SHA256SUMS --target "${{ steps.version.outputs.sha }}" \
            --title "Agentic Marketing v$v" --notes-file notes.md $flags
