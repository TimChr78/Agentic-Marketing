# Weekly dependency PRs (#177). Dependabot treats a pnpm workspace as the npm ecosystem at the
# workspace root. Minor and patch updates come grouped in one PR; majors one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # The Better Auth packages must move together: their peer ranges pin each other's exact
      # minor (`better-call`, `@better-auth/utils`, `@better-fetch/fetch`) and `@better-auth/mcp`
      # reaches `@better-auth/oauth-provider` by range, so a partial bump installs two versions of
      # the same plugin against one core (#720, #727). Listed first so it wins over the group below;
      # no `update-types`, so majors come in this PR too.
      better-auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'
          - 'better-call'
      minor-and-patch:
        update-types: [minor, patch]
    # The spikes are throwaway benchmarks, not part of CI or the image.
    exclude-paths:
      - spikes/**
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The Node major follows `engines` in package.json; change both together, by hand.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
