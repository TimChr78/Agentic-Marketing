# Weekly dependency PRs (#177). Dependabot treats a pnpm workspace as the npm ecosystem at the
# workspace root. Minor and patch updates come grouped in one PR; majors one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # The Better Auth packages must move together: their peer ranges pin each other's exact
      # minor (`better-call`, `@better-auth/utils`, `@better-fetch/fetch`) and `@better-auth/mcp`
      # reaches `@better-auth/oauth-provider` by range, so a partial bump installs two versions of
      # the same plugin against one core (#720, #727). Listed first so it wins over the group below;
      # no `update-types`, so majors come in this PR too.
      better-auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'
          - 'better-call'
          - '@better-fetch/fetch'
      minor-and-patch:
        update-types: [minor, patch]
        # Never split Better Auth: the plugins must ship in the group above with the core, or a
        # plugin pin and `better-auth` end up on different patches and typecheck fails (#980/#981).
        # Dependabot matched `@better-auth/*` here even though the group above names the same
        # pattern, so the exclusion is explicit.
        exclude-patterns:
          - 'better-auth'
          - '@better-auth/*'
          - 'better-call'
          - '@better-fetch/fetch'
    # The spikes are throwaway benchmarks, not part of CI or the image.
    exclude-paths:
      - spikes/**
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    # Covers the Dockerfile's base image. The Compose files need their own ecosystem below: this
    # one never opened a PR for them. A bump of a pinned digest is a runtime change: read it like a
    # version bump, not a formality.
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The Node major follows `engines` in package.json; change both together, by hand.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    # The service images pinned by tag and digest in docker-compose.yml and docker-compose.test.yml.
    # CI's ClickHouse service and scripts/preflight.sh name the same image by hand, and
    # deploy-config.test.ts fails until they match: update them in the same PR.
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Stay on the 26.8 LTS line; the move to the next LTS (27.3) is planned by hand (#1113).
      - dependency-name: clickhouse/clickhouse-server
        versions: ['>=26.9']
      # A PostgreSQL major is an install-level change with its own upgrade path (#1001).
      - dependency-name: postgres
        update-types: [version-update:semver-major]
