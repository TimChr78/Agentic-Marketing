name: Bug report
description: Something does not work as documented. Not for security problems.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove passwords, tokens, API keys, personal data and
        customer records from logs and screenshots before you paste them.

        A security problem does not belong in a public issue: report it privately through
        [SECURITY.md](https://github.com/TimChr78/Agentic-Marketing/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The behaviour you saw, and the screen, command or MCP tool it came from.
      placeholder: I published a signup form and the confirmation e-mail was not sent.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows it, starting from a fresh start.
      placeholder: |
        1. Settings → Forms → New form
        2. Publish, then submit it from the hosted page
        3. No e-mail arrives; the send log shows ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: What the documentation or the UI says should happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: >
        The running version, as shown in Settings → Workspace, `/healthz`, or
        `docker compose exec app am doctor`. Include the image tag for a container.
      placeholder: "0.15.0 (ghcr.io/timchr78/agentic-marketing:0.15.0)"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Docker Compose, release bundle
        - Docker Compose, built from source
        - Kubernetes with the Helm chart
        - Source checkout (`pnpm dev`)
        - Something else (say so in the log section)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: >
        The lines around the failure (`docker compose logs app`, the browser console) with
        secrets and personal data removed.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: This is not a security vulnerability, which goes to SECURITY.md instead.
          required: true
